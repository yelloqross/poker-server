<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파이썬 포커 웹 테스트</title>
    <style>
        body { font-family: sans-serif; background-color: #1b4332; color: white; text-align: center; padding: 30px; }
        .table { background-color: #2d6a4f; border: 8px solid #b7094c; border-radius: 100px; padding: 40px; margin: 20px auto; max-width: 600px; }
        .cards { font-size: 2rem; margin: 15px 0; }
        .info { font-size: 1.2rem; margin: 10px 0; }
        button { font-size: 1rem; padding: 10px 20px; margin: 5px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-call { background-color: #52b788; color: white; }
        .btn-raise { background-color: #ffb703; color: black; }
        .btn-fold { background-color: #e63946; color: white; }
    </style>
</head>
<body>

    <h1>♠♥ 파이썬 웹소켓 포커 게임 ◆♣</h1>

    <div class="table">
        <div class="info">현재 총 팟(Pot): <span id="pot" style="color: #ffb703; font-weight: bold;">$0</span></div>
        <div class="cards">커뮤니티 카드: <span id="community">[]</span></div>
        <hr style="border-color: #52b788;">
        <div class="info">내 칩: <span id="myChips">$0</span> | 봇 칩: <span id="botChips">$0</span></div>
        <div class="info" id="status" style="color: #aacc00;">상태 대기 중...</div>
    </div>

    <!-- 플레이어 액션 버튼 -->
    <div>
        <button class="btn-call" onclick="sendAction('CALL', 50)">콜 ($50)</button>
        <button class="btn-raise" onclick="sendAction('RAISE', 100)">레이즈 ($100)</button>
        <button class="btn-fold" onclick="sendAction('FOLD', 0)">폴드</button>
    </div>

    <script>
        // 1. 파이썬 웹소켓 서버와 연결 구축
        const socket = new WebSocket("ws://127.0.0.1:8000/ws");

        // 2. 서버에서 데이터가 넘어오면 웹 화면 업데이트
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            document.getElementById("pot").innerText = "$" + data.pot;
            document.getElementById("community").innerText = data.community_cards.join(" ");
            document.getElementById("myChips").innerText = "$" + data.player_chips;
            document.getElementById("botChips").innerText = "$" + data.bot_chips;
            document.getElementById("status").innerText = data.last_action;
        };

        // 3. 버튼 클릭 시 파이썬 서버로 명령 전송
        function sendAction(actionType, amountValue) {
            const packet = {
                action: actionType,
                amount: amountValue
            };
            socket.send(JSON.stringify(packet));
        }
    </script>
</body>
</html>
